# ============================================================
# Terminal capabilities
# ============================================================

set -g default-terminal "tmux-256color"

set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features ',*:extkeys:RGB'

set -g focus-events on


# ============================================================
# Prefix
# ============================================================

set -g prefix C-a
unbind C-b
bind C-a send-prefix


# ============================================================
# Splits
# ============================================================

unbind %
unbind '"'

# C-a |  horizontal split
# C-a -  vertical split
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


# ============================================================
# Popups
# ============================================================

# C-a y: Lazygit
bind y display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"


# C-a N: Create session
bind N display-popup -w 60 -h 10 -E "bash -lc '
  printf \"Session name (or exit/quit to cancel): \"
  read -r name

  case \"\$name\" in
    \"\"|exit|quit)
      exit 0
      ;;
  esac

  tmux new-session -d -s \"\$name\" &&
    tmux switch-client -t \"\$name\"
'"


# C-a X: Delete session
bind X display-popup -w 70 -h 12 -E "bash -lc '
  session=\$(tmux list-sessions | cut -d: -f1 | fzf --reverse)

  [ -z \"\$session\" ] && exit 0

  printf \"Delete session %s? (y/N): \" \"\$session\"
  read -r confirm

  case \"\$confirm\" in
    y|Y)
      tmux kill-session -t \"\$session\"
      ;;
  esac
'"


# C-a b: Browse sessions
bind b display-popup -w 70% -h 70% -E "bash -lc '
  current=\$(tmux display-message -p \"#S\")

  session=\$(
    {
      printf \"%s\n\" \"\$current\"
      tmux list-sessions |
        cut -d: -f1 |
        grep -vFx \"\$current\"
    } | fzf --reverse
  )

  [ -n \"\$session\" ] &&
    tmux switch-client -t \"\$session\"
'"


# ============================================================
# General behavior
# ============================================================

set -g mouse on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g set-clipboard on

# ============================================================
# Vi copy mode
# ============================================================

setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Keep selection active after mouse drag
unbind -T copy-mode-vi MouseDragEnd1Pane


# ============================================================
# Reload
# ============================================================

# C-a r
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"


# ============================================================
# Resize and zoom
# ============================================================

# C-a h/j/k/l
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# C-a m
bind m resize-pane -Z


# ============================================================
# TPM plugins
# ============================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @tmux_navigator_disable_when_zoomed "1"


# ============================================================
# TPM initialization — keep this at the bottom
# ============================================================

run '~/.tmux/plugins/tpm/tpm'
